<style>
  * { box-sizing: border-box; margin: 0; padding: 0 }

  h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px }

</style>

<div>
  <svg width="60" height="60" viewBox="0 0 100 100" fill="none">
